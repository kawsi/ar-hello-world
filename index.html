<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AR Hello World</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; }
    .info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
      text-align: center;
    }
  </style>

  <!-- A-Frame: 3Dシーンの記述 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR: 画像マーカー認識 -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div class="info">📷 マーカーカードにカメラを向けてください</div>

  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="overlayImg" src="./assets/overlay.png" crossorigin="anonymous">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <!-- マーカー0番に対するコンテンツ -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- 平面グラフィック（マーカー上で軽く上下動） -->
      <a-image
        src="#overlayImg"
        position="0 0 0"
        width="1"
        height="1"
        transparent="true"
        animation="property: position; from: 0 0 0; to: 0 0.1 0; dir: alternate; loop: true; dur: 1500; easing: easeInOutSine">
      </a-image>

    </a-entity>
  </a-scene>

</body>
</html>
