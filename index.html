<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>AR Demo v9</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: -apple-system, sans-serif; }
    .info {
      position: fixed;
      top: 12px;
      left: 12px;
      right: 12px;
      padding: 10px 14px;
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      border-radius: 8px;
      font-size: 14px;
      z-index: 10;
      pointer-events: none;
      text-align: center;
    }
    .counter {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px;
      background: rgba(0, 188, 212, 0.92);
      color: #fff;
      border-radius: 28px;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.04em;
      z-index: 10;
      pointer-events: none;
      transition: background-color 0.2s, transform 0.15s;
    }
    .counter.hit {
      background: rgba(230, 57, 136, 0.95);
      transform: translateX(-50%) scale(1.1);
    }
    .version {
      position: fixed;
      top: 12px;
      right: 12px;
      padding: 4px 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #ffeb3b;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      font-family: "SF Mono", Menlo, monospace;
      z-index: 11;
      pointer-events: none;
    }
  </style>

  <!-- A-Frame: 3Dシーンの記述 -->
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <!-- MindAR: 画像マーカー認識 -->
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>
<body>

  <div class="info">📷 マーカーにカメラを向けて、画像をタップ！</div>
  <div class="counter" id="counter">タップしてみて</div>
  <div class="version">v9</div>

  <a-scene
    mindar-image="imageTargetSrc: https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/card-example/card.mind; uiLoading: no;"
    color-space="sRGB"
    renderer="colorManagement: true;"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="overlayImg" src="./assets/overlay.png" crossorigin="anonymous">
    </a-assets>

    <a-camera
      position="0 0 0"
      look-controls="enabled: false"
      cursor="fuse: false; rayOrigin: mouse;"
      raycaster="near: 10; far: 10000; objects: .clickable;">
    </a-camera>

    <!-- マーカー0番に対するコンテンツ -->
    <a-entity mindar-image-target="targetIndex: 0">

      <!-- 平面グラフィック：マーカーと水平、静止、タップ反応のみ -->
      <a-image
        id="overlay"
        class="clickable"
        src="#overlayImg"
        position="0 0 0"
        width="1"
        height="1"
        transparent="true"
        animation__tap="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; dir: alternate; dur: 150; startEvents: click">
      </a-image>

    </a-entity>
  </a-scene>

  <script>
    const counterEl = document.getElementById('counter');
    let tapCount = 0;

    function registerTap() {
      const overlay = document.querySelector('#overlay');
      if (!overlay) {
        console.log('[AR] overlay not found, retrying...');
        setTimeout(registerTap, 300);
        return;
      }
      overlay.addEventListener('click', () => {
        tapCount++;
        counterEl.textContent = `タップ ${tapCount}`;
        counterEl.classList.add('hit');
        setTimeout(() => counterEl.classList.remove('hit'), 200);
        console.log('[AR] tap!', tapCount);
      });
      console.log('[AR] click handler registered');
    }

    // a-scene の loaded を待つ
    document.addEventListener('DOMContentLoaded', () => {
      const scene = document.querySelector('a-scene');
      if (scene.hasLoaded) {
        registerTap();
      } else {
        scene.addEventListener('loaded', registerTap);
      }
      // ターゲット認識ログ
      const target = document.querySelector('[mindar-image-target]');
      target.addEventListener('targetFound', () => {
        counterEl.textContent = 'マーカー認識OK・タップしてみて';
        console.log('[AR] targetFound');
      });
      target.addEventListener('targetLost', () => {
        console.log('[AR] targetLost');
      });
    });
  </script>

</body>
</html>
